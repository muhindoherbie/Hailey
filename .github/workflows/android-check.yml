name: Android check
# Builds the standalone APK and opens it on an Android emulator. Fails if the app crashes or
# Hailey's in-app server doesn't start. Runs on app changes and can be started manually.
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'mobile/**', 'src/**', 'server/**', 'vite.mobile.config.ts', 'package.json', '.github/workflows/android-check.yml']

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Build the app bundle
        run: npm run build:android
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '9.8.1' }
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/launch-test.sh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator
          path: |
            logcat.txt
            screenshot.png
          if-no-files-found: ignore
