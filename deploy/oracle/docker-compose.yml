# Hailey on an always-on Linux server (e.g. Oracle Cloud Always Free).
# Reached from anywhere through your ngrok address, so no ports need to be opened.
#
# Files that live ONLY on the server, next to this file (never commit them):
#   hailey.env  — Hailey settings (AI keys, PUBLIC_URL, VAPID keys…). DATA_DIR/HOST are set below.
#   ngrok.env   — NGROK_AUTHTOKEN=...
#   .env        — PUBLIC_URL=https://your-name.ngrok-free.dev (used by the ngrok command)
#
# Start / update:  docker compose up -d --build
services:
  hailey:
    build: ../..
    restart: unless-stopped
    env_file: hailey.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8787'
      DATA_DIR: /data
      TRUST_PROXY: 'true'
    volumes:
      - /home/ubuntu/hailey-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3

  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    env_file: ngrok.env
    command: ["http", "hailey:8787", "--url=${PUBLIC_URL}", "--log=stdout"]
    depends_on:
      - hailey
